<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タスク管理</title>
</head>

<body>
  <main>
    <section id="entry-zone">
      <h1>タスク管理</h1>
      <p>利用を開始するにはログインまたはユーザー登録を行ってください。</p>
      <nav aria-label="入口メニュー">
        <a href="/login">ログイン</a>
        <a href="/register">ユーザー登録</a>
      </nav>
    </section>

    <section id="home-zone" hidden>
      <h1>タスク一覧</h1>

      <section id="group-zone">
        <h2>グループ</h2>
        <button id="show-create-group" type="button">グループを作成</button>
        <button id="show-join-group" type="button">グループに参加</button>

        <form id="create-group-form" hidden>
          <label>グループ名 <input name="name" required></label>
          <button type="submit">作成</button>
          <button id="cancel-create-group" type="button">キャンセル</button>
        </form>

        <form id="join-group-form" hidden>
          <label>参加ID <input name="joinId" maxlength="6" required></label>
          <button type="submit">参加</button>
          <button id="cancel-join-group" type="button">キャンセル</button>
        </form>

        <p id="group-error" role="alert"></p>
        <h3>所属グループ</h3>
        <ul id="group-list"></ul>
      </section>

      <button id="show-create" type="button">タスク登録</button>

      <section id="task-list-zone">
        <h2>登録済みタスク</h2>
        <ul id="task-list"></ul>
      </section>

      <section id="task-create-zone" hidden>
        <h2 id="task-form-title">タスク登録</h2>
        <form id="task-form">
          <label>タスク内容 <input name="content" required></label>
          <label>担当者 <input name="assignee" required></label>
          <label>状態
            <select name="status">
              <option value="未着手">未着手</option>
              <option value="進行中">進行中</option>
              <option value="完了">完了</option>
            </select>
          </label>
          <label>開始日時 <input name="startAt" type="datetime-local" required></label>
          <label>終了日時 <input name="endAt" type="datetime-local" required></label>
          <button id="submit-task" type="submit">登録</button>
          <button id="cancel-create" type="button">一覧へ戻る</button>
        </form>
        <p id="form-error" role="alert"></p>
      </section>
    </section>
  </main>
  <script>
    (async () => {
      const entryZone = document.querySelector('#entry-zone');
      const homeZone = document.querySelector('#home-zone');
      try {
        const response = await fetch('/api/tasks/current-user', {
          cache: 'no-store',
          redirect: 'manual'
        });
        if (response.ok) {
          entryZone.hidden = true;
          homeZone.hidden = false;
          const script = document.createElement('script');
          script.src = '/task-list.js';
          document.body.append(script);
          return;
        }
      } catch (error) {
        // 未認証時は入口ページのままにする
      }
      entryZone.hidden = false;
      homeZone.hidden = true;
    })();
  </script>
</body>

</html>
