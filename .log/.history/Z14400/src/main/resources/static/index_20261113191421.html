<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タスク管理</title>
</head>

<body>
  <main>
    <h1>タスク一覧</h1>
    <button id="show-create" type="button">タスク登録</button>

    <section id="task-list-zone">
      <h2>登録済みタスク</h2>
      <ul id="task-list"></ul>
    </section>

    <section id="task-create-zone" hidden>
      <h2>タスク登録</h2>
      <form id="task-form">
        <label>タスク内容 <input name="content" required></label>
        <label>担当者 <input name="assignee" required></label>
        <label>状態
          <select name="status">
            <option value="未着手">未着手</option>
            <option value="進行中">進行中</option>
            <option value="完了">完了</option>
          </select>
        </label>
        <label>開始日時 <input name="startAt" type="datetime-local" required></label>
        <label>終了日時 <input name="endAt" type="datetime-local" required></label>
        <button type="submit">登録</button>
        <button id="cancel-create" type="button">一覧へ戻る</button>
      </form>
      <p id="form-error" role="alert"></p>
    </section>
  </main>
  <script>
    const listZone = document.querySelector('#task-list-zone');
    const createZone = document.querySelector('#task-create-zone');
    const taskList = document.querySelector('#task-list');
    const form = document.querySelector('#task-form');
    const formError = document.querySelector('#form-error');

    function showCreateZone() {
      listZone.hidden = true;
      createZone.hidden = false;
    }

    function showListZone() {
      createZone.hidden = true;
      listZone.hidden = false;
    }

    function renderTasks(tasks) {
      taskList.replaceChildren();
      tasks.forEach((task) => {
        const item = document.createElement('li');
        item.textContent = `${task.content} / 担当者: ${task.assignee} / 状態: ${task.status} / ${task.startAt} - ${task.endAt}`;
        taskList.append(item);
      });
    }

    async function loadTasks() {
      const response = await fetch('/api/tasks');
      if (!response.ok) throw new Error('一覧を取得できませんでした');
      renderTasks(await response.json());
    }

    document.querySelector('#show-create').addEventListener('click', showCreateZone);
    document.querySelector('#cancel-create').addEventListener('click', showListZone);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      formError.textContent = '';
      const values = Object.fromEntries(new FormData(form));
      try {
        const response = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(values)
        });
        if (!response.ok) throw new Error('登録に失敗しました');
        form.reset();
        await loadTasks();
        showListZone();
      } catch (error) {
        formError.textContent = error.message;
      }
    });

    loadTasks().catch((error) => {
      formError.textContent = error.message;
    });
  </script>
</body>

</html>
